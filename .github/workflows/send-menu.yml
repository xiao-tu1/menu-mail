name: 每日菜单推送

on:
  # 定时由腾讯云函数触发（workflow_dispatch），避免与 GitHub cron 重复
  workflow_dispatch:
    inputs:
      meal:
        description: '要发送的餐次'
        required: true
        default: lunch
        type: choice
        options:
          - breakfast
          - lunch
          - supper
      send_date:
        description: '日期：today / tomorrow'
        required: true
        default: today
        type: choice
        options:
          - today
          - tomorrow
      dry_run:
        description: '只生成不发送（测试用）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 解析参数
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MEAL="${{ github.event.inputs.meal }}"
            DATE="${{ github.event.inputs.send_date }}"
          else
            MEAL="lunch"
            DATE="today"
          fi
          echo "MEAL=$MEAL" >> "$GITHUB_ENV"
          echo "DATE=$DATE" >> "$GITHUB_ENV"

      - name: 生成菜单图片
        run: python send_meal.py --meal "$MEAL" --date "$DATE" --no-send

      - name: 提交图片到仓库
        run: |
          git config user.name "menu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "图片没有变化"
          else
            git commit -m "菜单图片 $MEAL $DATE"
            git push
          fi

      - name: 发送邮件（备用渠道）
        env:
          QQ_USER: ${{ secrets.QQ_USER }}
          QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
          QQ_TO: ${{ secrets.QQ_TO }}
        run: python send_meal.py --meal "$MEAL" --date "$DATE"

      - name: 推送到微信
        continue-on-error: true
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "dry_run，跳过推送"
          else
            python send_pushplus.py --meal "$MEAL" --date "$DATE"
          fi
